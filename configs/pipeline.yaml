# configs/pipeline.yaml
# Data budget, sampling rules, temporal purge gaps, and pipeline execution parameters.

budget:
  training_budget_gb: 25.0           # Maximum disk budget for all raw downloads and processed datacubes
  michaung_window_budget_gb: 6.0     # Budget allocated to the primary hindcast event (Cyclone Michaung)
  corpus_event_budget_gb: 19.0       # Budget allocated to multi-year screened training events

sampling:
  method: event_based                # Event-based sampling (cheap screening before full download)
  screening_source: imd_daily_gridded # Cheap daily screening dataset
  heavy_rain_screening_threshold_mm_24h: 64.5 # Heavy rain threshold to flag an event day
  event_window_padding_days_before: 1 # Lead-up days
  event_window_padding_days_after: 2  # Recession / flood days
  dry_controls_ratio: 0.25           # Fraction of dry control days included to prevent false-alarm skew

gfs:
  earliest_archive_date: "2021-03-22" # GFS v16 operational upgrade on AWS Open Data
  resolution_deg: 0.25
  lead_times_hours: [3, 6, 9, 12, 18, 24, 36, 48, 72]

splits:
  test_events:
    - id: chennai_michaung_2023
      name: "Cyclone Michaung (Dec 2023)"
      start_utc: "2023-11-30T00:00:00Z"
      end_utc: "2023-12-08T00:00:00Z"
    - id: chennai_nem_heavy_2021
      name: "Chennai Severe Inundation Event (Nov 2021)"
      start_utc: "2021-11-05T00:00:00Z"
      end_utc: "2021-11-13T00:00:00Z"
  validation_period:
    start_utc: "2023-10-01T00:00:00Z"
    end_utc: "2023-11-20T00:00:00Z"
  validation_events:
    - id: chennai_nem_val_2023_full
      name: "NEM 2023 Full Validation Season (Oct-Nov 2023)"
      start_utc: "2023-10-01T00:00:00Z"
      end_utc: "2023-11-20T00:00:00Z"
  train_events:
    - id: chennai_nem_2021_early
      name: "NEM 2021 Pre-Event Season (Oct 01 to Nov 01)"
      start_utc: "2021-10-01T00:00:00Z"
      end_utc: "2021-11-01T21:00:00Z"
    - id: chennai_nem_2021_late
      name: "NEM 2021 Post-Event Season (Nov 16 to Dec 31)"
      start_utc: "2021-11-16T03:00:00Z"
      end_utc: "2021-12-31T23:30:00Z"
    - id: chennai_nem_2022_full
      name: "NEM 2022 Full Season (Oct 01 to Dec 31)"
      start_utc: "2022-10-01T00:00:00Z"
      end_utc: "2022-12-31T23:30:00Z"
  purge_gap_hours: 75                # 72 h NWP horizon + 3 h nowcast input buffer between splits
  bootstrap_replicates: 1000         # Block-bootstrap for confidence intervals

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  outputs_dir: "outputs"
  provenance_dir: "outputs/provenance"
  reports_dir: "outputs/reports"
